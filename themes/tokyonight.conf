# tokyonight-night theme — janoamaral/tokyo-night-tmux
#
# This plugin reads @tokyo-night-tmux_* variables (hyphenated).
# The previous @tokyonight_* lines here were catppuccin/tmux's schema —
# tokyo-night-tmux never reads them, so they did nothing. Removed.
# Plugin docs: ~/.config/tmux/plugins/tokyo-night-tmux/user_docs/
set -g @plugin "janoamaral/tokyo-night-tmux"

# Theme variant: night | storm | day
set -g @tokyo-night-tmux_theme "night"

# Window-number style. The plugin default "digital" uses segmented-digit
# codepoints (U+1FBF0–U+1FBF9) that almost no font ships, so window numbers
# render as "?". "hsquare" = hollow-square Nerd Font digits — renders with
# JetBrainsMono NFM and matches the pane numbers (pane_id_style default).
set -g @tokyo-night-tmux_window_id_style "hsquare"

# Status bar position
set-option -g status-position top
